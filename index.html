<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a2b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Ледовый хоккей 95</title>
<style>
:root{--bg:#0b1a2b}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
const RW=1600,RH=400,GOAL=70,PER=75;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,S,OX,VH,DPR,camV=0,sw=0,snap=1,vg;
function rs(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(W/(RH+70),H/520);OX=(W-RH*S)/2;VH=H/S;vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);vg.addColorStop(0,'rgba(0,8,20,0)');vg.addColorStop(1,'rgba(0,8,20,.5)')}
const toUV=(x,y)=>sw?[RH-y,x]:[y,RW-x];
addEventListener('resize',rs);rs();

let teams,puck,ctrl,score=[0,0],time=PER,per=1,state='home',st=1.2,msg='Вбрасывание',hint=8,aP=0,bP=0,cP=0,tmsg='',tt=0;
const keys={};let joy={id:null,ox:0,oy:0,x:0,y:0};
const btnD=()=>({x:W-236,y:H-128,r:29}),btnB=()=>({x:W-70,y:H-80,r:48}),btnA=()=>({x:W-178,y:H-58,r:38}),btnC=()=>({x:W-125,y:H-160,r:36});
const hit=(b,x,y)=>Math.hypot(x-b.x,y-b.y)<b.r+8;
const LV=[{n:'Новичок',spd:.8,gs:120,pred:0,sp:110,pw:470,sr:1.2,ck:.4,st:1.5},{n:'Любитель',spd:.95,gs:170,pred:1,sp:70,pw:540,sr:2,ck:1,st:2.5},{n:'Профи',spd:1.08,gs:210,pred:1,sp:40,pw:590,sr:2.8,ck:1.4,st:3.8},{n:'Легенда',spd:1.2,gs:260,pred:1,sp:18,pw:640,sr:3.8,ck:2.2,st:5.5}];
const BASE={spd:1,gs:200,pred:1,sp:60,pw:560,sr:2.5,ck:1.2,st:3};
let lvl=1;
let ST=[{sh:0,hit:0,own:0},{sh:0,hit:0,own:0}],stam=1,stLock=0,bDown=0,bRel=0,bCh=0,bId=null,dId=null,tD=0,rec=[],recT=0,rp=0,overAt=0,meIdx=0,opIdx=1,REC={w:0,l:0,d:0,g:0},muted=0;
const TEAMS=[{nm:'ПОЛЯРНЫЕ ВОЛКИ',c:'#2f72e8'},{nm:'АЛЫЕ ГРИФОНЫ',c:'#e43d3a'},{nm:'ЗЕЛЁНЫЕ БАРСЫ',c:'#25a85a'},{nm:'ЗОЛОТЫЕ ТИГРЫ',c:'#e8a91c'},{nm:'ЛИЛОВЫЕ ЛИСЫ',c:'#8b52d6'},{nm:'МОРСКИЕ АКУЛЫ',c:'#17afb5'}];
function shade(h,k){const n=parseInt(h.slice(1),16),r=[n>>16,n>>8&255,n&255].map(v=>Math.round(k>0?v+(255-v)*k:v*(1+k)));return'#'+r.map(v=>v.toString(16).padStart(2,'0')).join('')}
function mkTeam(t){return{c:t.c,c2:shade(t.c,-.22),d:shade(t.c,-.5),l:shade(t.c,.45),pant:shade(t.c,-.6),nm:t.nm}}
try{const o=JSON.parse(localStorage.getItem('h95')||'{}');if(o.REC)REC=Object.assign(REC,o.REC);muted=o.muted?1:0}catch(e){}
function save(){try{localStorage.setItem('h95',JSON.stringify({REC,muted}))}catch(e){}}
let SE=null,mode='quick',otFlag=0,otGoal=0;
try{const q=localStorage.getItem('h95s');if(q)SE=JSON.parse(q)}catch(e){SE=null}
function saveSE(){try{if(SE)localStorage.setItem('h95s',JSON.stringify(SE))}catch(e){}}
// ---- сезон и плей-офф
function rr6(){const t=[0,1,2,3,4,5].sort(()=>Math.random()-.5),R=[];for(let r=0;r<5;r++){const g=[];for(let i=0;i<3;i++)g.push([t[i],t[5-i]]);R.push(g);t.splice(1,0,t.pop())}return R}
function newSeason(){const z=()=>[0,0,0,0,0,0];REC.s=(REC.s||0)+1;
  SE={me:meIdx,lv:lvl,n:REC.s,rounds:rr6(),rd:0,pts:z(),gf:z(),ga:z(),w:z(),l:z(),ph:'reg',str:z().map(()=>.85+Math.random()*.3),sem:null,fin:null,champ:-1,note:'',cur:0};save();saveSE()}
function pois(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function simGame(a,b){let x=pois(2.6*SE.str[a]/SE.str[b]),y=pois(2.6*SE.str[b]/SE.str[a]),o=0;if(x==y){o=1;if(Math.random()<.5)x++;else y++}return[x,y,o]}
function recordGame(a,b,ga,gb,ot){const w=ga>gb?a:b,l=ga>gb?b:a;SE.gf[a]+=ga;SE.ga[a]+=gb;SE.gf[b]+=gb;SE.ga[b]+=ga;SE.w[w]++;SE.l[l]++;SE.pts[w]+=2;if(ot)SE.pts[l]+=1}
function sortedIdx(){return[0,1,2,3,4,5].sort((a,b)=>SE.pts[b]-SE.pts[a]||(SE.gf[b]-SE.ga[b])-(SE.gf[a]-SE.ga[a])||SE.gf[b]-SE.gf[a]||a-b)}
const sw2=s=>s.wa>=2?s.a:s.wb>=2?s.b:-1;
function simSeries(s){while(sw2(s)<0){const g=simGame(s.a,s.b);if(g[0]>g[1])s.wa++;else s.wb++}}
function finishSeason(){SE.ph='done';if(SE.champ==SE.me)REC.t=(REC.t||0)+1;save()}
function finalSim(){SE.fin={a:sw2(SE.sem[0]),b:sw2(SE.sem[1]),wa:0,wb:0};simSeries(SE.fin);SE.champ=sw2(SE.fin);finishSeason()}
function startPO(){const r=sortedIdx();SE.sem=[{a:r[0],b:r[3],wa:0,wb:0},{a:r[1],b:r[2],wa:0,wb:0}];SE.ph='sem';
  if(!r.slice(0,4).includes(SE.me)){SE.note='Команда не вышла в плей-офф';simSeries(SE.sem[0]);simSeries(SE.sem[1]);finalSim()}}
function mySeries(){return SE.ph=='sem'?SE.sem.find(t=>t.a==SE.me||t.b==SE.me):SE.fin}
function seasonResult(ga,gb){
  const me=SE.me,opp=SE.cur;
  if(SE.ph=='reg'){
    recordGame(me,opp,ga,gb,otFlag);
    for(const g of SE.rounds[SE.rd])if(!g.includes(me)){const r=simGame(g[0],g[1]);recordGame(g[0],g[1],r[0],r[1],r[2])}
    SE.rd++;if(SE.rd>=5)startPO();
  }else{
    const s=mySeries(),won=ga>gb;
    if(s.a==me){if(won)s.wa++;else s.wb++}else{if(won)s.wb++;else s.wa++}
    if(sw2(s)>=0){
      if(SE.ph=='sem'){
        for(const t of SE.sem)simSeries(t);
        if(sw2(s)!=me){SE.note='Вылет в полуфинале';finalSim()}
        else{SE.fin={a:sw2(SE.sem[0]),b:sw2(SE.sem[1]),wa:0,wb:0};SE.ph='fin'}
      }else{SE.champ=sw2(s);SE.note=SE.champ==me?'Вы — чемпионы!':'Поражение в финале';finishSeason()}
    }
  }
  saveSE();
}
function seNext(){const me=SE.me;
  if(SE.ph=='reg'){const g=SE.rounds[SE.rd].find(g=>g.includes(me));return{opp:g[0]==me?g[1]:g[0],label:'Тур '+(SE.rd+1)+' из 5'}}
  const s=mySeries(),mine=s.a==me?s.wa:s.wb,th=s.a==me?s.wb:s.wa;
  return{opp:s.a==me?s.b:s.a,label:(SE.ph=='sem'?'Полуфинал':'ФИНАЛ')+' · до 2 побед · '+mine+':'+th}}
function startSeasonMatch(){const n=seNext();SE.cur=n.opp;meIdx=SE.me;lvl=SE.lv;TM[0]=mkTeam(TEAMS[SE.me]);TM[1]=mkTeam(TEAMS[n.opp]);restart()}
function homeGeo(i){return{x:W/2-130,y:H/2-72+i*64,w:260,h:54}}
function homePick(i){if(i==0){mode='quick';state='menu'}else if(i==1){mode='season';state='menu'}else if(i==2&&SE){mode='season';state='hub'}}
function homeTap(x,y){for(let i=0;i<3;i++){if(i==2&&!SE)continue;const b=homeGeo(i);if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){homePick(i);return}}}
function overNext(){state=mode=='season'&&SE?'hub':'home'}
function hubGeo(){return{bx:W/2-110,by:H-(H<420?54:86),bw:220,bh:44}}
function hubAction(){if(!SE)return;if(SE.ph=='done'){mode='season';state='menu';return}startSeasonMatch()}
function hubTap(x,y){const g=hubGeo();if(x<110&&y<44){state='home';return}if(x>g.bx&&x<g.bx+g.bw&&y>g.by&&y<g.by+g.bh)hubAction()}
const mb=i=>({x:W/2-130,y:H/2-110+i*58,w:260,h:48});
const HOME=[[90,200,1],[450,130],[450,270],[650,110],[650,290],[720,200]];
const NUMS=[[31,4,7,17,22,9],[35,5,3,12,19,88]];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mk(t,h,i){const x=t?RW-h[0]:h[0];return{num:NUMS[t][i],team:t,x,y:h[1],hx:x,hy:h[1],vx:0,vy:0,g:h[2],r:h[2]?13:11,f:t?Math.PI:0,t:0,stun:0,dash:0,ck:0,out:0,pen:0,ph:0,swing:0,sv:0}}
function reset(){
  teams=[HOME.map((h,i)=>mk(0,h,i)),HOME.map((h,i)=>mk(1,h,i))];
  puck={x:RW/2,y:200,vx:0,vy:0,own:null,cd:0,prot:0,by:null};
  ctrl=teams[0][5];
}
const act=()=>teams.flat().filter(p=>!p.out);
function faceoff(){if(otGoal){otGoal=0;state='over';overAt=gt;finish();snd('horn');return}snap=1;rec=[];recT=0;reset();state='face';st=1.2;msg='Вбрасывание'}
function restart(){otGoal=0;otFlag=0;ST=[{sh:0,hit:0,own:0},{sh:0,hit:0,own:0}];stam=1;stLock=0;bDown=bRel=0;bCh=0;score=[0,0];time=PER;per=1;sw=0;hint=8;clearTrail();faceoff()}
reset();

function pickMe(d){meIdx=(meIdx+d+TEAMS.length)%TEAMS.length}
function startGame(){if(mode=='season'){newSeason();state='hub';return}let o;do{o=Math.floor(Math.random()*TEAMS.length)}while(o==meIdx);opIdx=o;TM[0]=mkTeam(TEAMS[meIdx]);TM[1]=mkTeam(TEAMS[opIdx]);restart()}
function skipReplay(){faceoff()}
function pickGeo(){const sx=Math.min(W/2-26,150);return{lx:W/2-sx,rx:W/2+sx,cy:Math.round(H*(H<420?.43:.4)),bx:W/2-100,by:H-(H<420?64:96),bw:200,bh:46}}
function pickTap(x,y){const g=pickGeo();
  if(x<110&&y<44){state='menu';return}
  if(Math.hypot(x-g.lx,y-g.cy)<34)pickMe(-1);
  else if(Math.hypot(x-g.rx,y-g.cy)<34)pickMe(1);
  else if(x>g.bx&&x<g.bx+g.bw&&y>g.by&&y<g.by+g.bh)startGame();
  else if(Math.abs(y-g.cy)<90){if(x<W/2)pickMe(-1);else pickMe(1)}}
addEventListener('keydown',e=>{keys[e.code]=1;initA();
  if(state=='home'){const i=+e.key-1;if(i>=0&&i<3)homePick(i);return}
  if(state=='hub'){if(e.code=='Enter'||e.code=='Space')hubAction();else if(e.code=='Escape')state='home';return}
  if(state=='menu'&&e.code=='Escape'){state='home';return}
  if(state=='menu'){const i=+e.key-1;if(i>=0&&i<LV.length){lvl=i;state='pick'}return}
  if(state=='pick'){if(e.code=='ArrowLeft')pickMe(-1);else if(e.code=='ArrowRight')pickMe(1);else if(e.code=='Enter'||e.code=='Space')startGame();else if(e.code=='Escape')state='menu';return}
  if(state=='over'){if(gt-overAt>.8)overNext();return}
  if(state=='replay'){skipReplay();return}
  if(e.repeat)return;
  if(e.code=='KeyZ'||e.code=='Space')aP=1;if(e.code=='KeyX'||e.code=='Enter')bP=1;if(e.code=='KeyC')cP=1});
addEventListener('keyup',e=>{keys[e.code]=0;if(e.code=='KeyX'||e.code=='Enter')bRel=1});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initA();const x=e.clientX,y=e.clientY;
  if(x>W-44&&x<W-8&&y>muteY()&&y<muteY()+36){muted^=1;if(mg)mg.gain.value=muted?0:.8;save();return}
  if(state=='home'){homeTap(x,y);return}
  if(state=='hub'){hubTap(x,y);return}
  if(state=='menu'){if(x<110&&y<44){state='home';return}for(let i=0;i<LV.length;i++){const b=mb(i);if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){lvl=i;state='pick'}}return}
  if(state=='pick'){pickTap(x,y);return}
  if(state=='over'){if(gt-overAt>.8)overNext();return}
  if(state=='replay'){skipReplay();return}
  if(hit(btnB(),x,y)){bP=1;bId=e.pointerId}else if(hit(btnA(),x,y))aP=1;else if(hit(btnC(),x,y))cP=1;else if(hit(btnD(),x,y)){tD=1;dId=e.pointerId}
  else if(x<W*.55&&joy.id==null)joy={id:e.pointerId,ox:x,oy:y,x:0,y:0};
});
addEventListener('pointermove',e=>{
  if(e.pointerId!==joy.id)return;
  let dx=(e.clientX-joy.ox)/50,dy=(e.clientY-joy.oy)/50;const l=Math.hypot(dx,dy);
  if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;
});
const up=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0}if(e.pointerId===bId){bId=null;bRel=1}if(e.pointerId===dId){dId=null;tD=0}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);

// ---- звук (WebAudio, синтез без файлов)
let AC=null,mg=null,noiseB=null,crowdG=null;
function initA(){
  if(AC){if(AC.state=='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=muted?0:.8;mg.connect(AC.destination);
    const n=AC.sampleRate*2,bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;noiseB=bf;
    const src=AC.createBufferSource();src.buffer=bf;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=520;
    crowdG=AC.createGain();crowdG.gain.value=.05;src.connect(f);f.connect(crowdG);crowdG.connect(mg);src.start();
  }catch(e){AC=null}
}
function nz(dur,type,f0,f1,vol,q){const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseB;const f=AC.createBiquadFilter();f.type=type;f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random());s.stop(t+dur+.05)}
function tone(type,f0,f1,dur,vol,dl){const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.05)}
const SND={
  shot(p){nz(.14,'bandpass',1800,500,.55*p,1.5);tone('triangle',170,60,.12,.35*p)},
  pass(){nz(.07,'bandpass',2600,1200,.25,2)},
  hit(){nz(.26,'lowpass',900,120,.9);tone('sine',110,45,.22,.6)},
  board(v){nz(.08,'bandpass',900,400,.3*v,2)},
  post(){tone('triangle',1400,900,.25,.3);nz(.05,'highpass',3000,3000,.2)},
  whistle(){tone('square',2800,2750,.17,.1);tone('square',2850,2800,.24,.1,.22)},
  horn(){tone('sawtooth',196,190,1.1,.22);tone('sawtooth',294,285,1.1,.15)},
  goal(){SND.horn();const t=AC.currentTime;crowdG.gain.cancelScheduledValues(t);crowdG.gain.setValueAtTime(crowdG.gain.value,t);crowdG.gain.linearRampToValueAtTime(.24,t+.3);crowdG.gain.linearRampToValueAtTime(.05,t+3.2)}
};
function snd(n,a){if(!AC||muted)return;try{SND[n](a)}catch(e){}}
function aimAng(){const[ax,ay]=inp();return(ax||ay)?Math.atan2(ay,ax):Math.atan2(200-ctrl.y,RW-ctrl.x)}
function recFrame(){const fl=teams.flat();rec.push({p:fl.map(p=>[p.x,p.y,p.f,p.ph,p.stun,p.dash,p.swing,p.sv,p.out]),k:[puck.x,puck.y,fl.indexOf(puck.own)]});if(rec.length>80)rec.shift()}
function stepReplay(dt){
  rp+=dt*18;const n=rec.length-1;if(rp>=n+6){faceoff();return}
  const f=rec[Math.min(n,Math.floor(rp))],fl=teams.flat();
  fl.forEach((p,i)=>{const a=f.p[i];p.x=a[0];p.y=a[1];p.f=a[2];p.ph=a[3];p.stun=a[4];p.dash=a[5];p.swing=a[6];p.sv=a[7];p.out=a[8]});
  puck.x=f.k[0];puck.y=f.k[1];puck.own=f.k[2]>=0?fl[f.k[2]]:null;puck.vx=puck.vy=0;
}
function finish(){const a=score[0],b=score[1];if(a>b)REC.w++;else if(a<b)REC.l++;else REC.d++;REC.g+=a;save();if(mode=='season'&&SE)seasonResult(a,b)}

function inp(){
  let x=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),
      y=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(!x&&!y){x=joy.x;y=joy.y}
  const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return sw?[y,-x]:[-y,x];
}
function shoot(p,ang,sp,k){
  if(k)ST[p.team].sh++;snd(k?'shot':'pass',Math.min(1.2,sp/700));p.swing=1;puck.own=null;puck.by=p;puck.vx=Math.cos(ang)*sp;puck.vy=Math.sin(ang)*sp;puck.cd=.3;
  puck.x=p.x+Math.cos(ang)*(p.r+7);puck.y=p.y+Math.sin(ang)*(p.r+7);spray(puck.x,puck.y,ang+Math.PI,4,90);
}
function take(q){if(q.g)q.sv=1;puck.own=q;puck.prot=.5;if(q.team==0&&!q.g)ctrl=q}
function go(p,tx,ty,sp,dt){
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),k=Math.min(1,6*dt);
  if(d>4){p.vx+=(dx/d*sp-p.vx)*k;p.vy+=(dy/d*sp-p.vy)*k}else{p.vx*=.8;p.vy*=.8}
}
function nearest(t,ref,skip){let b=null,bd=1e9;for(const p of teams[t])if(!p.g&&!p.out&&p!==skip&&p.stun<=0){const d=dist(p,ref);if(d<bd){bd=d;b=p}}return b}
function pass(){
  const[ax,ay]=inp(),o=ctrl,aim=(ax||ay)?Math.atan2(ay,ax):0;let b=null,bs=-1e9;
  for(const p of teams[0])if(!p.g&&!p.out&&p!==o){
    const a=Math.atan2(p.y-o.y,p.x-o.x),dA=Math.abs(Math.atan2(Math.sin(a-aim),Math.cos(a-aim)));
    const s=-dA*200-dist(p,o)*.25;if(s>bs){bs=s;b=p}
  }
  if(b){shoot(o,Math.atan2(b.y-o.y,b.x-o.x),440);ctrl=b}
}
function check(p){if(p.ck>0||p.stun>0||p.dash>0||p.out||p.g)return;p.ck=1.2;p.dash=.3}
function penalty(p){
  p.out=1;p.pen=14;p.dash=0;p.stun=0;
  tmsg='Удаление: '+(p.team?'красные':'синие');tt=1.8;
  if(puck.own===p){puck.own=null;puck.cd=.3;puck.by=p}
  if(p===ctrl)ctrl=nearest(0,puck,p)||ctrl;
}
function bump(p,q){
  ST[p.team].hit++;snd('hit');fx.push({x:q.x,y:q.y,t:.35});spray(q.x,q.y,p.f,16,220);shake=6;q.stun=1.1;q.vx=Math.cos(p.f)*220;q.vy=Math.sin(p.f)*220;p.dash=0;
  if(puck.own===q){puck.own=null;puck.vx=Math.cos(p.f)*170+Math.random()*60;puck.vy=Math.sin(p.f)*170;puck.cd=.3;puck.by=q}
  else if(Math.random()<.05&&teams[p.team].filter(z=>z.out).length<2)penalty(p);

  cx.save();cx.strokeStyle='rgba(255,210,58,.25)';cx.lineWidth=5;cx.beginPath();cx.arc(ctrl.x,ctrl.y,ctrl.r+6,0,7);cx.stroke();
  cx.strokeStyle='#ffd23a';cx.lineWidth=2.4;cx.setLineDash([7,5]);cx.lineDashOffset=-gt*30;
  cx.beginPath();cx.arc(ctrl.x,ctrl.y,ctrl.r+6,0,7);cx.stroke();cx.restore();

    const ang=aimAng(),len=50+bCh*150,col='hsl('+(55-bCh*55)+',100%,60%)';

    for(let i=0;i<8;i++){const a=i*.785+.3;cx.moveTo(e.x+Math.cos(a)*(10+k*26),e.y+Math.sin(a)*(10+k*26));cx.lineTo(e.x+Math.cos(a)*(16+k*38),e.y+Math.sin(a)*(16+k*38))}
