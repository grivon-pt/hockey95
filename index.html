<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ледовый хоккей 95</title>
<meta name="theme-color" content="#0b1a2b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1a2b}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#sa{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style></head><body><div id="sa"></div><canvas id="c"></canvas>
<script>
// ================= ЯДРО =================
const RW=1600,RH=400,GOAL=70;
let PER=75;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,S,OX,VH,DPR,camV=0,camU=RH/2,camZ=1,sw=0,snap=1,vg,SAT=0,SAB=0,HOR=0,TP=0;
function rs(){
  DPR=Math.min(devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const sa=document.getElementById('sa');
  if(sa){const c=getComputedStyle(sa);SAT=parseFloat(c.paddingTop)||0;SAB=parseFloat(c.paddingBottom)||0}
  // HOR — площадка горизонтально (ворота слева и справа); VH — сколько единиц длины площадки видно на экране
  HOR=CFG.hor==2?W>H:CFG.hor==1;
  TP=HOR?0:SAT+76;S=HOR?Math.min(H/(RH+70),W/(H>W?400:520)):Math.min(W/(RH+70),(H-TP)/(W>H?400:520));OX=(W-RH*S)/2;VH=(HOR?W:H-TP)/S;
  vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);
  vg.addColorStop(0,'rgba(0,8,20,0)');vg.addColorStop(1,'rgba(0,8,20,.5)');snap=1;
}
// toUV: мировые координаты -> [поперёк площадки, вдоль площадки] в экранной ориентации
const toUV=(x,y)=>HOR?(sw?[RH-y,RW-x]:[y,x]):(sw?[RH-y,x]:[y,RW-x]);
function w2s(x,y){const u=toUV(x,y),k=S*camZ;return HOR?[k*(u[1]-camV),H/2+k*(u[0]-camU)]:[W/2+k*(u[0]-camU),TP+k*(u[1]-camV)]}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
addEventListener('resize',rs);

// ---- настройки и сохранения ----
let CFG={snd:1,vib:1,per:75,rep:1,auto:1,hor:0},REC={w:0,l:0,d:0,g:0,t:0,s:0},SE=null,MS=null;
try{const o=JSON.parse(localStorage.getItem('h95')||'{}');if(o.REC)Object.assign(REC,o.REC);if(o.CFG)Object.assign(CFG,o.CFG);else if(o.muted)CFG.snd=0}catch(e){}
try{const q=localStorage.getItem('h95s');if(q)SE=JSON.parse(q);if(SE&&(!SE.rounds||SE.me==null))SE=null}catch(e){SE=null}
try{const q=localStorage.getItem('h95m');if(q)MS=JSON.parse(q);if(MS&&(!MS.score||MS.me==null))MS=null}catch(e){MS=null}
rs();
function save(){try{localStorage.setItem('h95',JSON.stringify({REC,CFG}))}catch(e){}}
function saveSE(){try{if(SE)localStorage.setItem('h95s',JSON.stringify(SE))}catch(e){}}

// ---- команды (все названия и фамилии вымышлены) ----
// a = [скорость, бросок, вратарь], от 1 до 5; pl = вратарь, 2 защитника, 2 крайних, центр
const TEAMS=[
 {nm:'ПОЛЯРНЫЕ ВОЛКИ',c:'#2f72e8',k:'В',a:[4,3,4],pl:['Сугробов','Вьюгин','Буранов','Клыков','Северцев','Инеев']},
 {nm:'АЛЫЕ ГРИФОНЫ',c:'#e43d3a',k:'Г',a:[3,5,3],pl:['Крылатов','Огнев','Когтев','Пламенев','Зарницын','Искров']},
 {nm:'ЗЕЛЁНЫЕ БАРСЫ',c:'#25a85a',k:'Б',a:[5,3,3],pl:['Скальный','Ельников','Прыжков','Тайгин','Кедров','Рысев']},
 {nm:'ЗОЛОТЫЕ ТИГРЫ',c:'#e8a91c',k:'Т',a:[3,4,4],pl:['Полосатов','Рыков','Янтарёв','Гривин','Златов','Усачёв']},
 {nm:'ЛИЛОВЫЕ ЛИСЫ',c:'#8b52d6',k:'Л',a:[4,4,3],pl:['Хитров','Норкин','Рыжов','Хвостов','Сумеркин','Следов']},
 {nm:'МОРСКИЕ АКУЛЫ',c:'#17afb5',k:'А',a:[3,3,5],pl:['Плавников','Глубин','Рифов','Штормов','Волнов','Прибоев']}];
function shade(h,k){const n=parseInt(h.slice(1),16),r=[n>>16,n>>8&255,n&255].map(v=>Math.round(k>0?v+(255-v)*k:v*(1+k)));return'#'+r.map(v=>v.toString(16).padStart(2,'0')).join('')}
function mkTeam(i){const t=TEAMS[i];return{i,c:t.c,c2:shade(t.c,-.22),d:shade(t.c,-.5),l:shade(t.c,.45),pant:shade(t.c,-.6),nm:t.nm,k:t.k,a:t.a,pl:t.pl}}
const TM=[mkTeam(0),mkTeam(1)];
const LV=[
 {n:'Новичок',spd:.8,gs:120,pred:0,sp:110,pw:470,sr:1.2,ck:.4,st:1.5,pr:.5,aim:.2},
 {n:'Любитель',spd:.95,gs:170,pred:1,sp:70,pw:540,sr:2,ck:1,st:2.5,pr:.9,aim:.45},
 {n:'Профи',spd:1.08,gs:210,pred:1,sp:40,pw:590,sr:2.8,ck:1.4,st:3.8,pr:1.4,aim:.7},
 {n:'Легенда',spd:1.2,gs:260,pred:1,sp:18,pw:640,sr:3.8,ck:2.2,st:5.5,pr:2,aim:.9}];
const BASE={spd:1,gs:200,pred:1,sp:60,pw:560,sr:2.5,ck:1.2,st:3,pr:1.2,aim:.6};
const EF=[BASE,BASE];

// ---- состояние ----
let teams,puck,ctrl,score=[0,0],time=PER,per=1,state='face',st=1.2,msg='Вбрасывание',hint=0,aP=0,bP=0,cP=0,tmsg='',tt=0;
let demo=1,scr='home',setBack='home',SO=null,soG=0,cel=-1,fire=[0,0],fireT=[0,0],glog=[],conf=[],swT=0,passT=null,aFl=0,cFl=0,saveT=0,gsc='',crT=0;
let lvl=1,mode='quick',otFlag=0,otGoal=0,meIdx=0,opIdx=1,mTag='';
const newST=()=>[{sh:0,hit:0,own:0,sv:0},{sh:0,hit:0,own:0,sv:0}];
let ST=newST(),stam=1,stLock=0,bDown=0,bRel=0,bCh=0,bId=null,dId=null,tD=0,rec=[],recT=0,rp=0,overAt=0;
let UIB=[],UIK={};
const keys={};let joy={id:null,ox:0,oy:0,x:0,y:0};
const btnD=()=>({x:W-46,y:H-200-SAB,r:29}),btnB=()=>({x:W-70,y:H-80-SAB,r:48}),btnA=()=>({x:W-178,y:H-58-SAB,r:38}),btnC=()=>({x:W-125,y:H-160-SAB,r:36});
const pauseR=()=>({x:W-28,y:(W>=470?28:104)+SAT,r:18});
const hit=(b,x,y)=>Math.hypot(x-b.x,y-b.y)<b.r+8;
const HOME=[[90,200,1],[450,130],[450,270],[650,110],[650,290],[720,200]];
const NUMS=[[31,4,7,17,22,9],[35,5,3,12,19,88]];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// ---- сезон и плей-офф ----
function rr6(){const t=[0,1,2,3,4,5].sort(()=>Math.random()-.5),R=[];for(let r=0;r<5;r++){const g=[];for(let i=0;i<3;i++)g.push([t[i],t[5-i]]);R.push(g);t.splice(1,0,t.pop())}return R}
function newSeason(){const z=()=>[0,0,0,0,0,0];REC.s=(REC.s||0)+1;
  SE={me:meIdx,lv:lvl,n:REC.s,rounds:rr6(),rd:0,pts:z(),gf:z(),ga:z(),w:z(),l:z(),sc:z(),ph:'reg',str:z().map(()=>.85+Math.random()*.3),sem:null,fin:null,champ:-1,note:'',cur:0};
  clearMS();save();saveSE()}
function pois(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function simGame(a,b){let x=pois(2.6*SE.str[a]/SE.str[b]),y=pois(2.6*SE.str[b]/SE.str[a]),o=0;if(x==y){o=1;if(Math.random()<.5)x++;else y++}return[x,y,o]}
function recordGame(a,b,ga,gb,ot){const w=ga>gb?a:b,l=ga>gb?b:a;SE.gf[a]+=ga;SE.ga[a]+=gb;SE.gf[b]+=gb;SE.ga[b]+=ga;SE.w[w]++;SE.l[l]++;SE.pts[w]+=2;if(ot)SE.pts[l]+=1}
function sortedIdx(){return[0,1,2,3,4,5].sort((a,b)=>SE.pts[b]-SE.pts[a]||(SE.gf[b]-SE.ga[b])-(SE.gf[a]-SE.ga[a])||SE.gf[b]-SE.gf[a]||a-b)}
const sw2=s=>s.wa>=2?s.a:s.wb>=2?s.b:-1;
function simSeries(s){while(sw2(s)<0){const g=simGame(s.a,s.b);if(g[0]>g[1])s.wa++;else s.wb++}}
function finishSeason(){SE.ph='done';if(SE.champ==SE.me)REC.t=(REC.t||0)+1;save()}
function finalSim(){SE.fin={a:sw2(SE.sem[0]),b:sw2(SE.sem[1]),wa:0,wb:0};simSeries(SE.fin);SE.champ=sw2(SE.fin);finishSeason()}
function startPO(){const r=sortedIdx();SE.sem=[{a:r[0],b:r[3],wa:0,wb:0},{a:r[1],b:r[2],wa:0,wb:0}];SE.ph='sem';
  if(!r.slice(0,4).includes(SE.me)){SE.note='Команда не вышла в плей-офф';simSeries(SE.sem[0]);simSeries(SE.sem[1]);finalSim()}}
function mySeries(){return SE.ph=='sem'?SE.sem.find(t=>t.a==SE.me||t.b==SE.me):SE.fin}
function seasonResult(ga,gb){
  const me=SE.me,opp=SE.cur;
  if(SE.ph=='reg'){
    recordGame(me,opp,ga,gb,otFlag);
    for(const g of SE.rounds[SE.rd])if(!g.includes(me)){const r=simGame(g[0],g[1]);recordGame(g[0],g[1],r[0],r[1],r[2])}
    SE.rd++;if(SE.rd>=5)startPO();
  }else{
    const s=mySeries(),won=ga>gb;
    if(s.a==me){if(won)s.wa++;else s.wb++}else{if(won)s.wb++;else s.wa++}
    if(sw2(s)>=0){
      if(SE.ph=='sem'){
        for(const t of SE.sem)simSeries(t);
        if(sw2(s)!=me){SE.note='Вылет в полуфинале';finalSim()}
        else{SE.fin={a:sw2(SE.sem[0]),b:sw2(SE.sem[1]),wa:0,wb:0};SE.ph='fin'}
      }else{SE.champ=sw2(s);SE.note=SE.champ==me?'Вы — чемпионы!':'Поражение в финале';finishSeason()}
    }
  }
  saveSE();
}
function seNext(){const me=SE.me;
  if(SE.ph=='reg'){const g=SE.rounds[SE.rd].find(g=>g.includes(me));return{opp:g[0]==me?g[1]:g[0],label:'Тур '+(SE.rd+1)+' из 5'}}
  const s=mySeries(),mine=s.a==me?s.wa:s.wb,th=s.a==me?s.wb:s.wa;
  return{opp:s.a==me?s.b:s.a,label:(SE.ph=='sem'?'Полуфинал':'Финал')+' · до 2 побед · '+mine+':'+th}}
function seKey(){return SE?[SE.n,SE.ph,SE.rd,SE.sem?SE.sem.map(s=>s.wa+s.wb).join(''):'',SE.fin?SE.fin.wa+SE.fin.wb:''].join(':'):''}
const seTag=()=>mode=='season'&&SE?(SE.ph=='reg'?'Тур '+(SE.rd+1)+'/5':SE.ph=='sem'?'Полуфинал':'Финал'):'';

// ---- сохранение незаконченного матча ----
function saveMS(flip){
  if(demo||state=='over'||!teams)return;
  MS={mode,lvl,me:meIdx,op:opIdx,PER,score:score.slice(),per,time,sw:flip?sw^1:sw,ST,ot:otFlag,glog,fire:fire.slice(),so:SO?1:0,key:mode=='season'?seKey():''};
  try{localStorage.setItem('h95m',JSON.stringify(MS))}catch(e){}
}
function clearMS(){MS=null;try{localStorage.removeItem('h95m')}catch(e){}}
function msValid(){return!!MS&&(MS.mode=='quick'||(!!SE&&SE.ph!='done'&&MS.key===seKey()))}

// ---- запуск матчей ----
function mk(t,h,i){const x=t?RW-h[0]:h[0];return{idx:i,num:NUMS[t][i],name:TM[t].pl[i],team:t,x,y:h[1],hx:x,hy:h[1],vx:0,vy:0,g:h[2],r:h[2]?13:11,f:t?Math.PI:0,t:0,stun:0,dash:0,ck:0,out:0,pen:0,ph:0,swing:0,sv:0}}
function setEF(){
  const m=(b,T)=>Object.assign({},b,{spd:b.spd*(1+(T.a[0]-3)*.04),pw:b.pw*(1+(T.a[1]-3)*.04),sp:b.sp*(1-(T.a[1]-3)*.12),gs:b.gs*(1+(T.a[2]-3)*.09)});
  EF[0]=m(demo?LV[2]:BASE,TM[0]);EF[1]=m(demo?LV[2]:LV[lvl],TM[1]);
}
function reset(){
  teams=[HOME.map((h,i)=>mk(0,h,i)),HOME.map((h,i)=>mk(1,h,i))];
  puck={x:RW/2,y:200,vx:0,vy:0,own:null,cd:0,prot:0,by:null,hot:0};
  ctrl=teams[0][5];passT=null;cel=-1;
}
const act=()=>teams.flat().filter(p=>!p.out);
function faceoff(){
  if(otGoal){otGoal=0;endMatch();return}
  snap=1;rec=[];recT=0;reset();state='face';st=1.2;msg='Вбрасывание';
}
function restart(){
  otGoal=0;otFlag=0;ST=newST();stam=1;stLock=0;bDown=bRel=0;bCh=0;score=[0,0];time=PER;per=1;sw=0;hint=demo?0:9;
  fire=[0,0];fireT=[0,0];glog=[];conf=[];SO=null;soG=0;saveT=0;tt=0;clearTrail();faceoff();
}
function startDemo(){
  demo=1;const a=Math.floor(Math.random()*TEAMS.length);let b;do{b=Math.floor(Math.random()*TEAMS.length)}while(b==a);
  TM[0]=mkTeam(a);TM[1]=mkTeam(b);PER=75;setEF();restart();
}
function goHome(){scr='home';startDemo()}
function beginMatch(){
  demo=0;scr=null;TM[0]=mkTeam(meIdx);TM[1]=mkTeam(opIdx);PER=CFG.per;mTag=seTag();setEF();restart();
  state='intro';st=2.8;snd('organ');saveMS();
}
function pickMe(d){meIdx=(meIdx+d+TEAMS.length)%TEAMS.length}
function startGame(){
  if(mode=='season'){newSeason();scr='hub';return}
  let o;do{o=Math.floor(Math.random()*TEAMS.length)}while(o==meIdx);opIdx=o;beginMatch();
}
function startSeasonMatch(){const n=seNext();SE.cur=n.opp;meIdx=SE.me;lvl=SE.lv;opIdx=n.opp;mode='season';saveSE();beginMatch()}
function resumeMatch(){
  const m=MS;demo=0;scr=null;mode=m.mode;lvl=m.lvl;meIdx=m.me;opIdx=m.op;if(mode=='season'&&SE)SE.cur=m.op;
  TM[0]=mkTeam(meIdx);TM[1]=mkTeam(opIdx);PER=m.PER||75;mTag=seTag();setEF();restart();
  score=m.score.slice();per=m.per;time=m.time;sw=m.sw;ST=m.ST;otFlag=m.ot;glog=m.glog||[];fire=m.fire||[0,0];
  for(const s of ST)if(s.sv==null)s.sv=0;
  if(m.so)startSO();
}
function pause(){if(demo||scr||state=='over')return;saveMS();scr='pause';joy.id=null;joy.x=joy.y=0;tD=0;dId=null;bDown=0;bId=null}
function exitMatch(){saveMS();goHome()}
function skipReplay(){faceoff()}
function overNext(){if(mode=='season'&&SE){scr='hub';startDemo()}else goHome()}
function hubAction(){if(!SE)return;if(SE.ph=='done'){mode='season';scr='menu';return}if(msValid()&&MS.mode=='season')resumeMatch();else startSeasonMatch()}

// ---- ввод ----
addEventListener('keydown',e=>{
  keys[e.code]=1;initA();
  if(scr){const k=UIK;
    if(e.code=='Escape'&&k.esc){click();k.esc()}
    else if((e.code=='Enter'||e.code=='Space')&&k.enter){click();k.enter()}
    else if(e.code=='ArrowLeft'&&k.left)k.left();
    else if(e.code=='ArrowRight'&&k.right)k.right();
    else if(k.num&&k.num[e.key]){click();k.num[e.key]()}
    return}
  if(demo)return;
  if(e.code=='Escape'||e.code=='KeyP'){pause();return}
  if(state=='over'){if(UIK.enter&&(e.code=='Enter'||e.code=='Space'))UIK.enter();return}
  if(state=='intro'){st=0;return}
  if(state=='replay'){skipReplay();return}
  if(state=='brk2'){if(st<3)st=Math.min(st,.05);return}
  if(e.repeat)return;
  if(e.code=='KeyZ'||e.code=='Space'){aP=1;aFl=.15}
  if(e.code=='KeyX'||e.code=='Enter')bP=1;
  if(e.code=='KeyC'){cP=1;cFl=.15}
});
addEventListener('keyup',e=>{keys[e.code]=0;if(e.code=='KeyX'||e.code=='Enter')bRel=1});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initA();const x=e.clientX,y=e.clientY;
  for(let i=UIB.length-1;i>=0;i--){const b=UIB[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){click();b.act();return}}
  if(scr||demo)return;
  if(state=='over')return;
  if(hit(pauseR(),x,y)){pause();return}
  if(state=='intro'){st=0;return}
  if(state=='replay'){skipReplay();return}
  if(state=='brk2'){if(st<3)st=Math.min(st,.05);return}
  const gk=SO&&ctrl.g;
  if(!gk){
    if(hit(btnB(),x,y)){bP=1;bId=e.pointerId;return}
    if(hit(btnA(),x,y)){aP=1;aFl=.15;return}
    if(hit(btnC(),x,y)){cP=1;cFl=.15;return}
    if(hit(btnD(),x,y)){tD=1;dId=e.pointerId;return}
  }
  if((x<W*.55||gk)&&joy.id==null)joy={id:e.pointerId,ox:x,oy:y,x:0,y:0};
});
addEventListener('pointermove',e=>{
  if(e.pointerId!==joy.id)return;
  let dx=(e.clientX-joy.ox)/50,dy=(e.clientY-joy.oy)/50;const l=Math.hypot(dx,dy);
  if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;
});
const up=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0}if(e.pointerId===bId){bId=null;bRel=1}if(e.pointerId===dId){dId=null;tD=0}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!demo&&!scr&&state!='over'){if(state=='intro')saveMS();else pause()}});
addEventListener('pagehide',()=>{if(!demo&&scr!='pause')saveMS()});

// ---- звук (WebAudio, синтез без файлов) и вибрация ----
let AC=null,mg=null,noiseB=null,crowdG=null;
function initA(){
  if(AC){if(AC.state=='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=CFG.snd?.8:0;mg.connect(AC.destination);
    const n=AC.sampleRate*2,bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;noiseB=bf;
    const src=AC.createBufferSource();src.buffer=bf;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=520;
    crowdG=AC.createGain();crowdG.gain.value=.03;src.connect(f);f.connect(crowdG);crowdG.connect(mg);src.start();
  }catch(e){AC=null}
}
function nz(dur,type,f0,f1,vol,q){const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseB;const f=AC.createBiquadFilter();f.type=type;f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random());s.stop(t+dur+.05)}
function tone(type,f0,f1,dur,vol,dl){const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.05)}
const SND={
  shot(p){nz(.14,'bandpass',1800,500,.55*p,1.5);tone('triangle',170,60,.12,.35*p)},
  pass(){nz(.07,'bandpass',2600,1200,.25,2)},
  hit(){nz(.26,'lowpass',900,120,.9);tone('sine',110,45,.22,.6)},

}
// прицел: без джойстика — в свободный угол; если джойстик смотрит в сторону ворот — бросок «притягивается» в створ
function aimAng(){
  const v=inp(),dx=RW-60-ctrl.x,gk=teams[1][0];
  if(!(v[0]||v[1])){if(dx>20)return Math.atan2(200+(gk.y>200?-1:1)*24-ctrl.y,dx);return ctrl.f}
  const a=Math.atan2(v[1],v[0]);

}

}

  if(k){if(SO){if(!p.g)SO.shot=1}else{ST[p.team].sh++;addFire(p.team,.04)}if(p===ctrl)vib(12)}
  snd(k?'shot':'pass',Math.min(1.2,sp/700));p.swing=1;puck.own=null;puck.by=p;puck.hot=hot?1:0;

function take(q){

function nearest(t,ref,skip){let b=null,bd=1e9;for(const p of teams[t])if(!p.g&&!p.out&&p!==skip&&p.stun<=0){const d=dist(p,ref);if(d<bd){bd=d;b=p}}return b}
function laneOpen(x0,y0,x1,y1,t,all,w){

// кому отдаст пас управляемый игрок: ближе к направлению джойстика (или взгляда) и ближе по расстоянию

// ---- ИИ ----
function passBest(p,all,md){
  const t=p.team,dir=t?-1:1,gx=t?0:RW;let b=null,bs=-1e9;
  for(const q of teams[t]){
    if(q===p||q.g||q.out||q.stun>0)continue;
    const d=dist(p,q);if(d<60||d>520)continue;
    const prog=dir*(q.x-p.x);
    if(md==2&&prog<60)continue;if(md==1&&prog<40)continue;if(md==0&&prog<-220)continue;
    if(!laneOpen(p.x,p.y,q.x,q.y,t,all,20))continue;
    let op=130;for(const o of all)if(o.team!==t&&!o.g){const dd=dist(o,q);if(dd<op)op=dd}
    if(md==2&&op<60)continue;
    let s=op*1.1+prog*.45-d*.12;
    if(Math.abs(gx-q.x)<300&&Math.abs(q.y-p.y)>80)s+=70;
    if(s>bs){bs=s;b=q}
  }
  return b;
}
function spot(p,t,dir,gx,ogx,sit){
  const i=p.idx,px=puck.x,py=puck.y,side=(i==1||i==3)?-1:1,w=Math.sin(gt*.8+i*2.1+t)*14;
  const lim=(x,l)=>dir*(x-l)>0?l:x,low=(x,l)=>dir*(x-l)<0?l:x;
  if(sit>0){
    if(i==3||i==4){
      if(Math.abs(gx-px)<340){
        if((py-200)*side<0)return[gx-dir*125,200+side*42+w,150];
        return[lim(px+dir*40,gx-dir*110),200+side*118,145];
      }
      return[lim(px+dir*160,gx-dir*150),200+side*100+w,150];
    }
    if(i==5)return[lim(px+dir*70,gx-dir*200),200+(py>200?-38:38)+w,145];
    return[low(lim(px-dir*210,gx-dir*480),ogx+dir*260),200+side*72+w,130];
  }
  if(i==1||i==2){
    if((py-200)*side>=0){const g0=ogx+dir*62;return[g0+(px-g0)*.52,200+(py-200)*.62,150]}
    return[ogx+dir*128,200+side*16,140];
  }
  if(i==5)return[low(px-dir*80,ogx+dir*150),200+(py-200)*.45,150];
  return[low(px+dir*60,ogx+dir*230),200+side*96+w,140];
}
function carry(p,dt,all,A,fm){
  const t=p.team,dir=t?-1:1,gx=t?0:RW,gl=gx-dir*60,dG=Math.abs(gl-p.x);
  let thr=null,td=1e9;for(const q of all)if(q.team!==t&&!q.g&&q.stun<=0){const d=dist(p,q);if(d<td){td=d;thr=q}}
  let tx=gx-dir*150,ty=200+(p.y<200?30:-30);
  if(SO)ty=200+Math.sin(gt*3+p.num)*42;
  if(thr&&td<80&&dir*(thr.x-p.x)>-15){ty=clamp(p.y+(thr.y>p.y?-1:1)*75,36,RH-36);tx=p.x+dir*70}
  go(p,tx,ty,155*A.spd*fm,dt);
  const gk=teams[1-t][0];
  if(dir*(gl-p.x)>40&&dG<(SO?230:340)){
    const sg=Math.abs(gk.y-200)>4?(gk.y>200?-1:1):(p.y>200?-1:1);
    const ay=200+sg*27*(SO?.6+.4*A.aim:A.aim)+(Math.random()-.5)*A.sp*(SO?.4:.8);
    const rate=A.sr*(laneOpen(p.x,p.y,gl,ay,t,all,15)?1:.25)*(dG<160?1.8:1)*(SO?1.6:1);
    if(Math.random()<dt*rate){shoot(p,Math.atan2(ay-p.y,gl-p.x),A.pw,1);return}
  }
  if(SO)return;
  const press=td<55;
  if(Math.random()<dt*A.pr*(press?2.2:1)){const b=passBest(p,all,press?0:2);if(b)passTo(p,b,440)}
}
function think(p,dt,all,ch,A,fm){
  const t=p.team,dir=t?-1:1,gx=t?0:RW,ogx=t?RW:0,own=puck.own;
  if(p.g){
    let gy=puck.y;
    if(A.pred&&!own&&Math.abs(puck.vx)>80&&(ogx-puck.x)/puck.vx>0)gy=puck.y+puck.vy*(ogx-puck.x)/puck.vx;
    else if(Math.abs(puck.x-ogx)>520)gy=200+(puck.y-200)*.4;
    go(p,ogx+dir*90,clamp(gy,172,228),A.gs,dt);
    if(own===p){p.t+=dt;if(p.t>.55){p.t=0;const b=passBest(p,all,1);if(b)passTo(p,b,430);else shoot(p,(t?Math.PI:0)+(Math.random()-.5)*1.2,450)}}
    return;
  }
  if(own===p){carry(p,dt,all,A,fm);return}
  if(p===ch[t]){
    go(p,puck.x+puck.vx*.15,puck.y+puck.vy*.15,162*A.spd*fm,dt);
    if(own&&own.team!==t&&dist(p,own)<70&&Math.random()<dt*A.ck){p.f=Math.atan2(own.y-p.y,own.x-p.x);check(p)}
    return;
  }
  const s=spot(p,t,dir,gx,ogx,own?(own.team==t?1:-1):(dir*(puck.x-RW/2)>0?1:-1));
  go(p,clamp(s[0],110,RW-110),clamp(s[1],28,RH-28),s[2]*A.spd*fm,dt);
}

  }

  const all=act(),human=!demo,v=human?inp():[0,0],ax=v[0],ay=v[1];

  let tb=1;
  if(human){
    const want=(keys.ShiftLeft||keys.ShiftRight||keys.KeyV||tD)&&(ax||ay);stLock=Math.max(0,stLock-dt);
    if(want&&stam>0&&stLock<=0){tb=1.4;stam=Math.max(0,stam-dt*(fireT[0]>0?.2:.4));if(stam<=0)stLock=1.2;if(Math.random()<dt*14)spray(ctrl.x,ctrl.y,ctrl.f+Math.PI,1,70)}

    if(ctrl.g){aP=bP=cP=0;bRel=0;bDown=0}
    if(aP){aP=0;
      if(puck.own===ctrl)pass();else{const b=nearest(0,puck,null);if(b){ctrl=b;swT=.7}}}
    if(bP){bP=0;bDown=1;bCh=0}
    if(bDown&&puck.own===ctrl&&ctrl.stun<=0&&!bRel)bCh=Math.min(1,bCh+dt/.75);
    if(bRel){bRel=0;
      if(bDown){bDown=0;

          const ang=aimAng(),c=bCh,sc=.15-.1*c,pm=1+(TM[0].a[1]-3)*.04;

        }
      }

    if(cP){cP=0;
      if(ctrl.ck<=0&&ctrl.stun<=0&&ctrl.dash<=0&&!ctrl.out){
        if(stam<.2){tmsg='Нет сил! Подождите';tt=.9}
        else{stam-=.2;const o=nearest(1,ctrl,null);
          if(o&&dist(o,ctrl)<150)ctrl.f=Math.atan2(o.y-ctrl.y,o.x-ctrl.x);

    if(CFG.auto&&!SO&&swT<=0&&ctrl.dash<=0&&puck.own!==ctrl&&(!puck.own||puck.own.team==1)){
      const b=nearest(0,puck,null);if(b&&b!==ctrl&&dist(b,puck)+90<dist(ctrl,puck)){ctrl=b;swT=1.1}}
    passT=puck.own===ctrl&&!SO?passPick():null;
  }else{aP=bP=cP=0;bRel=0}
  const ch=[null,null],po=puck.own;
  for(const t of[0,1]){
    if(po&&(po.team==t||po.g))continue;
    let bd=1e9;for(const p of teams[t])if(!p.g&&!p.out&&p.stun<=0&&(demo||p!==ctrl)){const d=dist(p,puck);if(d<bd){bd=d;ch[t]=p}}
  }
  for(const p of all){

    else if(p.dash>0){
      p.dash-=dt;p.vx=Math.cos(p.f)*430;p.vy=Math.sin(p.f)*430;

    }
    else if(human&&p===ctrl){
      const k=Math.min(1,8*dt),m=180*(1+(TM[0].a[0]-3)*.04)*fm*tb*(bDown&&bCh>0?1-.35*bCh:1);
      p.vx+=(ax*m-p.vx)*k;p.vy+=(ay*m-p.vy)*k;
    }
    else think(p,dt,all,ch,A,fm);
    const ox0=p.x,oy0=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.ph+=Math.hypot(p.vx,p.vy)*dt*.06;p.swing=Math.max(0,p.swing-dt*4);p.sv=Math.max(0,p.sv-dt*3);
    p.x=clamp(p.x,p.r,RW-p.r);p.y=clamp(p.y,p.r,RH-p.r);
    if(p.g&&human&&p===ctrl){p.x=clamp(p.x,70,140);p.y=clamp(p.y,156,244)}
    if(!p.g)trail(ox0,oy0,p.x,p.y,Math.hypot(p.vx,p.vy));
    for(const n of[0,1]){
      const x0=n?RW-60:44,qx=clamp(p.x,x0,x0+16),qy=clamp(p.y,165,235),dx=p.x-qx,dy=p.y-qy,dd=Math.hypot(dx,dy);
      if(dd<p.r){if(dd>.01){p.x+=dx/dd*(p.r-dd);p.y+=dy/dd*(p.r-dd)}else p.y+=(p.y<200?-1:1)*p.r}
    }
    if(p.g){const fw=t?Math.PI:0,a=Math.atan2(puck.y-p.y,puck.x-p.x);p.f=fw+clamp(Math.atan2(Math.sin(a-fw),Math.cos(a-fw)),-1.1,1.1)}
    else if(p.dash<=0&&Math.hypot(p.vx,p.vy)>25)p.f=Math.atan2(p.vy,p.vx);
  }
  if(state!='play')return;
  if(puck.own){
    const o=puck.own;
    puck.x=clamp(o.x+Math.cos(o.f)*(o.r+8),6,RW-6);puck.y=clamp(o.y+Math.sin(o.f)*(o.r+8),6,RH-6);puck.vx=puck.vy=0;puck.prot-=dt;puck.hot=0;
    if(!SO)ST[o.team].own+=dt;
    if(puck.prot<=0)for(const q of all)
      if(q.team!==o.team&&q.stun<=0&&dist(q,o)<q.r+o.r+4&&Math.random()<dt*EF[q.team].st*(fireT[q.team]>0?1.3:1)){addFire(q.team,.06);take(q);break}
  }else{
    puck.cd-=dt;const px=puck.x,py=puck.y;puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;
    const f=Math.pow(.55,dt);puck.vx*=f;puck.vy*=f;
    if(puck.hot&&Math.random()<dt*70)flame(puck.x,puck.y);
    if(puck.y<6){puck.y=6;puck.vy=Math.abs(puck.vy);chip(puck.x,6,Math.PI/2)}
    if(puck.y>RH-6){puck.y=RH-6;puck.vy=-Math.abs(puck.vy);chip(puck.x,RH-6,-Math.PI/2)}
    for(const n of[0,1]){
      const gx=n?RW-60:60,s=n?1:-1,d=s*(puck.x-gx),dp=s*(px-gx);
      if(dp<=0&&d>0&&Math.abs(puck.y-200)<GOAL/2-2){goal(n?0:1);return}

      for(const q of[-1,1]){const yl=200+q*GOAL/2;

    }

    if(puck.x>RW-6){puck.x=RW-6;puck.vx=-Math.abs(puck.vx);chip(RW-6,puck.y,Math.PI)}

    if(SO&&state=='play'&&SO.shot&&!puck.own){SO.sh+=dt;if(SO.sh>1.5||Math.hypot(puck.vx,puck.vy)<30)soDone(0,'Мимо!')}
  }
}

function trail(x0,y0,x1,y1,sp){
  if(sp<60)return;
  const a=Math.atan2(y1-y0,x1-x0),nx=-Math.sin(a),ny=Math.cos(a),al=Math.min(.2,sp/1500+.05);

    tc.strokeStyle='rgba(255,255,255,'+(al*1.8)+')';tc.beginPath();tc.moveTo(x0+nx*(o+.9),y0+ny*(o+.9));tc.lineTo(x1+nx*(o+.9),y1+ny*(o+.9));tc.stroke();
  }
}
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function rrPt(x,y,w,h,r,s){
  const a1=w-2*r,a2=h-2*r,ar=Math.PI*r/2;
  if(s<a1)return[x+r+s,y];s-=a1;
  if(s<ar){const a=-Math.PI/2+s/r;return[x+w-r+Math.cos(a)*r,y+r+Math.sin(a)*r]}s-=ar;
  if(s<a2)return[x+w,y+r+s];s-=a2;
  if(s<ar){const a=s/r;return[x+w-r+Math.cos(a)*r,y+h-r+Math.sin(a)*r]}s-=ar;
  if(s<a1)return[x+w-r-s,y+h];s-=a1;
  if(s<ar){const a=Math.PI/2+s/r;return[x+r+Math.cos(a)*r,y+h-r+Math.sin(a)*r]}s-=ar;
  if(s<a2)return[x,y+h-r-s];s-=a2;
  const a=Math.PI+s/r;return[x+r+Math.cos(a)*r,y+r+Math.sin(a)*r];
}

function buildLayer(){
  lay.width=Math.ceil((RW+2*M)*LK);lay.height=Math.ceil((RH+2*M)*LK);
  const c=lay.getContext('2d');c.scale(LK,LK);c.translate(M,M);
  const R=rng(7);
  c.fillStyle='#060d18';c.fillRect(-M,-M,RW+2*M,RH+2*M);
  const skin=['#f0cfae','#d9a77e','#a97550','#6f4a31'];
  const cols=['#2f72e8','#e43d3a','#f1f3f6','#1d2638','#34425f','#59678a','#d6a542','#26314a','#3b2f48'];
  const N=Math.floor((M-30)/8);
  for(let j=0;j<N;j++){
    const d=30+j*8,w=RW+2*d,h=RH+2*d,r=70+d,P=2*(w-2*r)+2*(h-2*r)+2*Math.PI*r;
    c.lineWidth=8.2;c.strokeStyle=j%2?'#141c2c':'#101725';c.beginPath();c.roundRect(-d,-d,w,h,r);c.stroke();
    for(let s=R()*6;s<P;s+=6.2+R()*2.6){
      const pt=rrPt(-d,-d,w,h,r,s),q=R();
      c.fillStyle=q<.17?cols[0]:q<.34?cols[1]:q<.42?cols[2]:cols[3+Math.floor(R()*6)];
      c.beginPath();c.ellipse(pt[0],pt[1],4,3.1,0,0,7);c.fill();
      c.fillStyle=skin[Math.floor(R()*4)];c.beginPath();c.arc(pt[0],pt[1],2.1,0,7);c.fill();
    }
    c.lineWidth=8.2;c.strokeStyle='rgba(4,8,16,'+(.12+Math.pow(j/N,1.2)*.78)+')';c.beginPath();c.roundRect(-d,-d,w,h,r);c.stroke();
  }
  // лёд
  c.save();c.beginPath();c.roundRect(0,0,RW,RH,70);c.clip();
  let g=c.createLinearGradient(0,0,0,RH);g.addColorStop(0,'#d2e5f4');g.addColorStop(.5,'#eef7fd');g.addColorStop(1,'#cfe2f2');
  c.fillStyle=g;c.fillRect(0,0,RW,RH);
  for(let i=0;i<5;i++){
    const x=160+i*320;
    g=c.createRadialGradient(x,200,0,x,200,300);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.fillRect(x-300,0,600,RH);
    c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(x-30,150,46,9,-.2,0,7);c.fill();
    c.beginPath();c.ellipse(x+40,255,38,7,.15,0,7);c.fill();
  }
  for(let i=0;i<260;i++){
    const x=R()*RW,y=R()*RH,rad=18+R()*60,a=.025+R()*.04;
    g=c.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0,R()<.5?'rgba(150,190,225,'+a+')':'rgba(255,255,255,'+(a*2)+')');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  c.lineCap='round';
  for(let i=0;i<1500;i++){
    const ng=R()<.35;
    let x=ng?(R()<.5?40+R()*180:RW-220+R()*180):R()*RW,y=R()*RH,a=R()*6.28;
    const len=14+R()*110,cu=(R()-.5)*.012;
    c.strokeStyle=R()<.55?'rgba(255,255,255,'+(.25+R()*.3)+')':'rgba(90,130,175,'+(.05+R()*.09)+')';
    c.lineWidth=.4+R()*.8;c.beginPath();c.moveTo(x,y);
    for(let s=0;s<len;s+=6){a+=cu*6;x+=Math.cos(a)*6;y+=Math.sin(a)*6;c.lineTo(x,y)}
    c.stroke();
  }
  c.shadowColor='rgba(10,30,60,.6)';c.shadowBlur=20*LK;c.fillStyle='#000';
  c.beginPath();c.rect(-M,-M,RW+2*M,RH+2*M);c.roundRect(0,0,RW,RH,70);c.fill('evenodd');
  c.restore();
}

  rr(x-4,y-2,w+8,24+n*rh,12,'rgba(8,16,32,.6)','rgba(130,160,220,.25)');
  const cols=[w-170,w-135,w-100,w-65,w-28];cx.font='bold 10px system-ui';cx.fillStyle='#7d90b5';cx.textAlign='left';cx.fillText('КОМАНДА',x+30,y+12);cx.textAlign='right';
  ['И','В','П','О','Р'].forEach((t,i)=>cx.fillText(t,x+cols[i]+14,y+12));y+=18;
  sortedIdx().forEach((t,i)=>{
    const ry=y+i*rh,me=t==SE.me,gp=SE.w[t]+SE.l[t];
    if(me)rr(x,ry,w,rh-2,6,'rgba(255,255,255,.13)');
    if(i==3){cx.fillStyle='rgba(255,210,90,.55)';cx.fillRect(x+4,ry+rh-2,w-8,1)}
    cx.fillStyle=TEAMS[t].c;cx.beginPath();cx.arc(x+22,ry+rh/2-1,4,0,7);cx.fill();
    cx.font=(me?'bold ':'')+'12px system-ui';cx.textAlign='left';cx.fillStyle=me?'#fff':'#c9d8f5';cx.fillText((i+1)+'',x+6,ry+rh/2+3);cx.fillText(TEAMS[t].nm,x+32,ry+rh/2+3);
    cx.textAlign='right';const gd=SE.gf[t]-SE.ga[t];
    [gp,SE.w[t],SE.l[t],SE.pts[t]].forEach((v,k)=>{cx.fillStyle=k==3?'#ffcf5c':'#c9d8f5';cx.fillText(v,x+cols[k]+14,ry+rh/2+3)});
    cx.fillStyle=gd>0?'#7dffc8':gd<0?'#ff9f94':'#c9d8f5';cx.fillText((gd>0?'+':'')+gd,x+cols[4]+14,ry+rh/2+3);
  });
  y+=n*rh+10;cx.textAlign='center';cx.font='10.5px system-ui';cx.fillStyle='#7d90b5';cx.fillText('И — игры · В — победы · П — поражения · О — очки · Р — разница',W/2,y+8,W-12);y+=24;
  const sl=t=>TEAMS[t.a].nm+'  '+t.wa+'–'+t.wb+'  '+TEAMS[t.b].nm;
  cx.font='12px system-ui';cx.fillStyle='#c9d8f5';
  if(SE.sem){cx.fillStyle='#8fa3c9';cx.fillText('Полуфиналы (до 2 побед)',W/2,y);y+=16;cx.fillStyle='#c9d8f5';for(const t of SE.sem){cx.fillText(sl(t),W/2,y,W-12);y+=16}}
  if(SE.fin){cx.fillStyle='#ffe28a';cx.fillText('Финал: '+sl(SE.fin),W/2,y,W-12);y+=16}
  const g={bx:W/2-115,by:H-(lg?54:88)-SAB,bw:230,bh:44};
  if(!lg&&SE.sc){
    const top=SE.sc.map((v,i)=>[v,i]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,3);
    if(top.length&&y+30<g.by-40){cx.fillStyle='#8fa3c9';cx.fillText('Бомбардиры: '+top.map(a=>TEAMS[SE.me].pl[a[1]]+' '+a[0]).join(' · '),W/2,y+10,W-12);y+=24}
  }
  cx.textAlign='center';
  if(SE.ph=='done'){
    cx.font='bold 16px system-ui';cx.fillStyle='#ffd23a';cx.fillText(SE.champ==SE.me?'ВЫ — ЧЕМПИОНЫ СЕЗОНА!':'Чемпион: '+TEAMS[SE.champ].nm,W/2,Math.min(y+24,g.by-26));
    if(SE.note&&SE.champ!=SE.me){cx.font='12px system-ui';cx.fillStyle='#9bb7e6';cx.fillText(SE.note,W/2,Math.min(y+42,g.by-9))}
    btn(g.bx,g.by,g.bw,g.bh,'#7a56c9','#4e3596','Новый сезон',null,hubAction);
  }else{
    const nx=seNext(),res=msValid()&&MS.mode=='season';
    cx.font='13px system-ui';cx.fillStyle='#9bb7e6';cx.fillText(nx.label+' · соперник: '+TEAMS[nx.opp].nm,W/2,g.by-11,W-12);
    btn(g.bx,g.by,g.bw,g.bh,'#35c27a','#1c8250',res?'ПРОДОЛЖИТЬ МАТЧ '+MS.score[0]+':'+MS.score[1]:'ИГРАТЬ МАТЧ',null,hubAction);
  }
  UIK.enter=hubAction;
}
function scrSet(){
  bgOv(.88);const bk=()=>{save();scr=setBack};back('Назад',bk);
  const lg=H<500,w=Math.min(W-28,350),x=(W-w)/2,rh=lg?34:46,gp=lg?5:9;
  const rows=[
   ['Звук',CFG.snd?'Вкл':'Выкл',()=>{CFG.snd^=1;if(mg)mg.gain.value=CFG.snd?.8:0}],
   ['Вибрация',CFG.vib?'Вкл':'Выкл',()=>{CFG.vib^=1;if(CFG.vib&&navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}],
   ['Длина периода',CFG.per==45?'45 секунд':CFG.per==75?'75 секунд':'2 минуты',()=>{CFG.per=CFG.per==45?75:CFG.per==75?120:45}],
   ['Повторы голов',CFG.rep?'Вкл':'Выкл',()=>{CFG.rep^=1}],

    const on=r[1]!='Выкл';rr(x+w-128,y+rh/2-13,116,26,13,on?'rgba(53,194,122,.9)':'rgba(120,130,150,.55)');
    cx.textAlign='center';cx.font='bold 13px system-ui';cx.fillStyle='#fff';cx.fillText(r[1],x+w-70,y+rh/2+4.5);
    const a=r[2];ub(x,y,w,rh,()=>{a();save()});y+=rh+gp;
  }
  cx.textAlign='center';cx.font='11.5px system-ui';cx.fillStyle='#7d90b5';
  wrap('Длина периода — для новых матчей. «По экрану» — площадка поворачивается вместе с телефоном.',W/2,y+12,w,14);
}
function scrHelp(){
  bgOv(.9);back('Назад',()=>{scr=setBack});
  const lg=H<500,w=Math.min(W-24,lg?560:380),x=(W-w)/2,fs=lg?11.5:13,lh=lg?14.5:17.5,kw=lg?92:100;

function scrPause(){
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='rgba(4,10,22,.72)';cx.fillRect(0,0,W,H);cx.textBaseline='alphabetic';
  const lg=H<500,w=Math.min(W-40,300),bh=lg?40:46,gp=lg?8:10,h=74+4*(bh+gp)+8,x=(W-w)/2,y=Math.max(SAT+4,(H-h)/2);

const SCR={home:scrHome,menu:scrMenu,pick:scrPick,hub:scrHub,set:scrSet,help:scrHelp,pause:scrPause};

// ---- главный кадр ----
function camUpd(){
  const gkv=SO&&!demo&&ctrl.g,fk=gkv?(VH/camZ>900?.5:.7):0,pv=toUV(puck.x+(ctrl.x-puck.x)*fk,puck.y+(ctrl.y-puck.y)*fk),zt=(state=='goal'||state=='replay'||(state=='sor'&&soG))?1.18:1;
  camZ+=(zt-camZ)*.06;
  const vl=VH/camZ,vs=(HOR?H:W)/(S*camZ),dl=HOR?(sw?-puck.vx:puck.vx):(sw?puck.vx:-puck.vx),lead=state=='play'&&!SO?clamp(dl*.22,-70,70):0;
  const tv=vl>=RW+88?(RW-vl)/2:clamp(pv[1]+lead-vl/2,-44,RW+44-vl),tu=vs>=RH+60?RH/2:clamp(pv[0],vs/2-30,RH+30-vs/2);
  if(snap){camV=tv;camU=tu;camZ=zt;snap=0}else{camV+=(tv-camV)*.12;camU+=(tu-camU)*.12}
}
function draw(){
  cx.setTransform(DPR,0,0,DPR,0,0);cx.textBaseline='alphabetic';cx.fillStyle='#060d18';cx.fillRect(0,0,W,H);
  camUpd();
  const k=S*camZ*DPR,jx=(Math.random()-.5)*shake*S*DPR*.7,jy=(Math.random()-.5)*shake*S*DPR*.7;
  cx.save();
  if(HOR){
    const a=-S*camZ*camV*DPR+jx,b=(H/2-S*camZ*camU)*DPR+jy;
    if(sw)cx.setTransform(-k,0,0,-k,k*RW+a,k*RH+b);else cx.setTransform(k,0,0,k,a,b);
  }else{
    const a=(W/2-S*camZ*camU)*DPR+jx,b=(TP-S*camZ*camV)*DPR+jy;
    if(sw)cx.setTransform(0,k,-k,0,k*RH+a,b);else cx.setTransform(0,-k,k,0,a,k*RW+b);
  }
  cx.drawImage(lay,-M,-M,RW+2*M,RH+2*M);
  drawBoards();drawMarks();
  cx.drawImage(trc,0,0,RW,RH);
  drawNet(0);drawNet(1);
  const all=act();
  for(const p of all)drawShadow(p);
  for(const p of all)if(p.g)drawP(p);
  for(const p of all)if(!p.g)drawP(p);
  if(!demo&&state!='over'){
    const cr=ctrl.r*PS+5;
    cx.save();cx.strokeStyle='rgba(255,210,58,.25)';cx.lineWidth=5;cx.beginPath();cx.arc(ctrl.x,ctrl.y,cr,0,7);cx.stroke();
    cx.strokeStyle='#ffd23a';cx.lineWidth=2.4;cx.setLineDash([7,5]);cx.lineDashOffset=-gt*30;
    cx.beginPath();cx.arc(ctrl.x,ctrl.y,cr,0,7);cx.stroke();cx.restore();
    if(passT&&state=='play'&&!passT.out){
      cx.save();cx.strokeStyle='rgba(110,215,255,.9)';cx.lineWidth=2;cx.setLineDash([4,4]);cx.lineDashOffset=gt*24;
      cx.beginPath();cx.arc(passT.x,passT.y,passT.r*PS+4,0,7);cx.stroke();cx.restore();
    }
    if(state=='play'&&bDown&&puck.own===ctrl&&bCh>.02){
      const ang=aimAng(),len=50+bCh*150,col='hsl('+(55-bCh*55)+',100%,60%)';
      cx.save();cx.translate(ctrl.x,ctrl.y);cx.lineCap='round';
      cx.strokeStyle=col;cx.lineWidth=3;cx.beginPath();cx.arc(0,0,cr+5,-Math.PI/2,-Math.PI/2+bCh*Math.PI*2);cx.stroke();
      cx.rotate(ang);cx.globalAlpha=.85;cx.lineWidth=2.5;cx.setLineDash([8,6]);cx.lineDashOffset=-gt*40;
      cx.beginPath();cx.moveTo(cr+4,0);cx.lineTo(len,0);cx.stroke();cx.setLineDash([]);
      cx.fillStyle=col;cx.beginPath();cx.moveTo(len+10,0);cx.lineTo(len-3,-7);cx.lineTo(len-3,7);cx.closePath();cx.fill();cx.restore();
    }
  }
  drawPuck();
  for(const q of parts){cx.fillStyle='rgba('+(q.c||'235,247,255')+','+Math.min(1,q.t/q.m*1.2)+')';cx.beginPath();cx.arc(q.x,q.y,q.s,0,7);cx.fill()}
  for(const e of fx){
    const k2=1-e.t/.35;
    cx.strokeStyle='rgba(255,240,170,'+(1-k2)+')';cx.lineWidth=3.5*(1-k2)+.5;cx.beginPath();cx.arc(e.x,e.y,8+k2*42,0,7);cx.stroke();
    cx.strokeStyle='rgba(255,255,255,'+(.8*(1-k2))+')';cx.lineWidth=1.2;cx.beginPath();
    for(let i=0;i<8;i++){const an=i*.785+.3;cx.moveTo(e.x+Math.cos(an)*(10+k2*26),e.y+Math.sin(an)*(10+k2*26));cx.lineTo(e.x+Math.cos(an)*(16+k2*38),e.y+Math.sin(an)*(16+k2*38))}
    cx.stroke();
  }
  const gl=(state=='goal'&&st>.3)||(state=='sor'&&soG),nfl=gl?40:Math.random()<.2?1:0;
  cx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<nfl;i++){
    const r=Math.random(),q=30+Math.random()*110;let x,y;
    if(r<.4){x=-40+Math.random()*(RW+80);y=-q}
    else if(r<.8){x=-40+Math.random()*(RW+80);y=RH+q}
    else if(r<.9){x=-q;y=Math.random()*RH}
    else{x=RW+q;y=Math.random()*RH}
    cx.fillRect(x,y,2.4,2.4);
  }
  cx.restore();
  cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  if(demo)return;
  if(gl){
    const g=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6),al=Math.round((.16+.14*Math.sin(gt*14))*255).toString(16).padStart(2,'0');
    g.addColorStop(0,TM[gwho].c+'00');g.addColorStop(1,TM[gwho].c+al);cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }
  for(const q of conf){cx.save();cx.translate(q.x,q.y);cx.rotate(q.rot);cx.globalAlpha=Math.min(1,q.t);cx.fillStyle=q.c;cx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);cx.restore()}
  if(state=='intro'){introScr();return}
  hud();minimap();
  if(state!='replay'&&state!='over')controls();
  if(state=='play'||state=='face'){
    const p=w2s(ctrl.x,ctrl.y);cx.fillStyle='#ffd23a';cx.strokeStyle='rgba(0,0,0,.5)';cx.lineWidth=1.5;
    if(HOR){
      if(p[0]<6||p[0]>W-6){const d=p[0]<6?-1:1,x=d<0?18:W-18,y=clamp(p[1],96+SAT,H-30-SAB);
        cx.beginPath();cx.moveTo(x+d*9,y);cx.lineTo(x-d*6,y-9);cx.lineTo(x-d*6,y+9);cx.closePath();cx.fill();cx.stroke()}
    }else if(p[1]<74+SAT||p[1]>H-6){
      const up=p[1]<74+SAT,x=clamp(p[0],22,W-22),y=up?96+SAT+(SO?30:0):H-24-SAB,d=up?-1:1;
      cx.beginPath();cx.moveTo(x,y+d*9);cx.lineTo(x-9,y-d*6);cx.lineTo(x+9,y-d*6);cx.closePath();cx.fill();cx.stroke();
    }
  }
  if(state=='replay')replayTag();
  else if(state=='over')overPanel();
  else if(state!='play')banner();
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;gt+=dt;
  if(!scr||demo)upd(dt);
  UIB=[];UIK={};
  draw();
  if(scr){SCR[scr]();cx.setTransform(DPR,0,0,DPR,0,0)}
  requestAnimationFrame(loop);
}
startDemo();buildLayer();requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
